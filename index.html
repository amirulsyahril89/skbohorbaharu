<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sekolah Kebangsaan Bohor Baharu</title>
  <meta name="description" content="Laman web rasmi Sekolah Kebangsaan Bohor Baharu" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <div class="header-row wrap">
      <div class="brand">
        <img src="assets/logo.png" alt="Lambang Sekolah" />
        <div class="brand-text">
          <h1 id="brand-name">Nama Sekolah Anda</h1>
          <p id="brand-motto">Laman Web Rasmi Sekolah</p>
        </div>
      </div>
    </div>
    <nav class="wrap">
      <div class="tabs" id="tabs"></div>
    </nav>
    <div class="gradient-bar"></div>
  </header>

  <main>
    <div class="wrap content-inner" id="content-inner"></div>
  </main>

  <footer>
    <div class="wrap footer-grid" id="footer-grid"></div>
    <div class="footer-bottom" id="footer-bottom"></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
